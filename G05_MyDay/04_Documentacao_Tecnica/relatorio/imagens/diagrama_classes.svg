<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Arial, Helvetica, sans-serif" font-size="11">
  <rect width="820" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="losango" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,6 L6,1 L11,6 L6,11 z" fill="#161A24"/>
    </marker>
    <marker id="losangoVazio" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,6 L6,1 L11,6 L6,11 z" fill="#FFFFFF" stroke="#161A24"/>
    </marker>
  </defs>
  <style>
    .cab { fill: #161A24; }
    .nome { fill: #FFFFFF; font-weight: bold; font-size: 12px; }
    .a { fill: #161A24; }
    .op { fill: #3D5AFE; }
    .l { stroke: #161A24; stroke-width: 1.3; fill: none; }
    .m { fill: #161A24; font-size: 10px; }
    .enum { fill: #5B6372; font-style: italic; }
  </style>

  <!-- ligações -->
  <path class="l" d="M210 110 H310"/><text class="m" x="215" y="104">1</text><text class="m" x="296" y="104">*</text><text class="m" x="236" y="124">escreve</text>
  <path class="l" d="M110 200 V300"/><text class="m" x="116" y="214">1</text><text class="m" x="116" y="296">*</text><text class="m" x="64" y="256">cria</text>
  <path class="l" d="M210 360 H250 V170 H310" marker-start="url(#losangoVazio)"/><text class="m" x="222" y="376">0..1</text><text class="m" x="298" y="164">*</text><text class="m" x="256" y="300">agrupa</text>
  <path class="l" d="M500 110 H560" marker-start="url(#losango)"/><text class="m" x="540" y="104">*</text><text class="m" x="506" y="124">anexa</text>
  <path class="l" d="M405 190 V300"/><text class="m" x="411" y="204">0..1</text><text class="m" x="411" y="296">*</text><text class="m" x="411" y="252">sobre</text>
  <path class="l" d="M500 160 H620 V300"/><text class="m" x="506" y="154">0..1</text><text class="m" x="626" y="296">*</text><text class="m" x="560" y="174">alvo</text>
  <path class="l" d="M30 90 H14 V22 H90 V40"/><text class="m" x="96" y="30">segue  * — *</text>
  
  

  <!-- Utilizador -->
  <rect x="30" y="40" width="180" height="160" fill="#FFFFFF" stroke="#161A24" stroke-width="1.5"/>
  <rect class="cab" x="30" y="40" width="180" height="24"/>
  <text class="nome" x="120" y="57" text-anchor="middle">Utilizador</text>
  <text class="a" x="38" y="80">id: int</text>
  <text class="a" x="38" y="95">email: String</text>
  <text class="a" x="38" y="110">nome: String</text>
  <text class="a" x="38" y="125">papel: Papel</text>
  <text class="a" x="38" y="140">consentLocalizacao: bool</text>
  <line x1="30" y1="150" x2="210" y2="150" stroke="#161A24"/>
  <text class="op" x="38" y="167">primeiroNome(): String</text>
  <text class="op" x="38" y="182">eAmigoDe(u): bool</text>

  <!-- Registo -->
  <rect x="310" y="40" width="190" height="150" fill="#FFFFFF" stroke="#3D5AFE" stroke-width="2"/>
  <rect x="310" y="40" width="190" height="24" fill="#3D5AFE"/>
  <text class="nome" x="405" y="57" text-anchor="middle">Registo</text>
  <text class="a" x="318" y="80">id, uuidCliente</text>
  <text class="a" x="318" y="95">titulo, texto: String</text>
  <text class="a" x="318" y="110">visibilidade: Visibilidade?</text>
  <text class="a" x="318" y="125">local: Localizacao?</text>
  <text class="a" x="318" y="140">dataRegisto: DateTime</text>
  <line x1="310" y1="148" x2="500" y2="148" stroke="#3D5AFE"/>
  <text class="op" x="318" y="164">visibilidadeEfetiva()</text>
  <text class="op" x="318" y="179">copyWith(...): Registo</text>

  <!-- Ficheiro -->
  <rect x="560" y="40" width="160" height="95" fill="#FFFFFF" stroke="#161A24" stroke-width="1.5"/>
  <rect class="cab" x="560" y="40" width="160" height="24"/>
  <text class="nome" x="640" y="57" text-anchor="middle">Ficheiro</text>
  <text class="a" x="568" y="80">tipo: TipoFicheiro</text>
  <text class="a" x="568" y="95">caminho: String</text>
  <text class="a" x="568" y="110">tamanhoBytes: int</text>
  <text class="a" x="568" y="125">duracaoSeg: int?</text>

  <!-- Enumerações -->
  <rect x="740" y="40" width="70" height="95" fill="#F4F5F7" stroke="#8A8F99"/>
  <text class="enum" x="775" y="56" text-anchor="middle">«enum»</text>
  <text class="a" x="775" y="70" text-anchor="middle" font-weight="bold">Visibilidade</text>
  <text class="a" x="775" y="88" text-anchor="middle">privado</text>
  <text class="a" x="775" y="102" text-anchor="middle">amigos</text>
  <text class="a" x="775" y="116" text-anchor="middle">publico</text>

  <!-- Projeto -->
  <rect x="30" y="300" width="180" height="120" fill="#FFFFFF" stroke="#161A24" stroke-width="1.5"/>
  <rect class="cab" x="30" y="300" width="180" height="24"/>
  <text class="nome" x="120" y="317" text-anchor="middle">Projeto</text>
  <text class="a" x="38" y="340">id: int</text>
  <text class="a" x="38" y="355">titulo, descricao: String</text>
  <text class="a" x="38" y="370">visibilidade: Visibilidade</text>
  <line x1="30" y1="380" x2="210" y2="380" stroke="#161A24"/>
  <text class="op" x="38" y="397">linhaTemporal(): List</text>
  <text class="op" x="38" y="412">copyWith(...): Projeto</text>

  <!-- Comentario -->
  <rect x="320" y="300" width="170" height="80" fill="#FFFFFF" stroke="#161A24" stroke-width="1.5"/>
  <rect class="cab" x="320" y="300" width="170" height="24"/>
  <text class="nome" x="405" y="317" text-anchor="middle">Comentario</text>
  <text class="a" x="328" y="340">id: int</text>
  <text class="a" x="328" y="355">texto: String</text>
  <text class="a" x="328" y="370">criadoEm: DateTime</text>

  <!-- Denuncia -->
  <rect x="540" y="300" width="180" height="100" fill="#FFFFFF" stroke="#161A24" stroke-width="1.5"/>
  <rect class="cab" x="540" y="300" width="180" height="24"/>
  <text class="nome" x="630" y="317" text-anchor="middle">Denuncia</text>
  <text class="a" x="548" y="340">motivo: String</text>
  <text class="a" x="548" y="355">estado: EstadoDenuncia</text>
  <line x1="540" y1="363" x2="720" y2="363" stroke="#161A24"/>
  <text class="op" x="548" y="380">aceitar() · rejeitar()</text>
  <text x="30" y="460" font-size="11" fill="#5B6372">Também existem GrupoEstudo, Mensagem, Lembrete, Conquista e AcaoAdmin, ligadas a Utilizador (ver Dicionário de Dados).</text>
</svg>
